[project]
name = "warmgraph"
version = "0.1.0"
description = "Warmgraph core — signal-to-community GTM engine (shared by api, workers, mcp)"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["warmgraph*"]
