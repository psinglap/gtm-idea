<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank you for celebrating with Akshiv 🐒</title>
  <meta name="description" content="Thanks for celebrating my birthday with me — with love, Akshiv ❤️" />
  <meta property="og:title" content="Thank you for celebrating with Akshiv 🐒" />
  <meta property="og:description" content="Thanks for celebrating my birthday with me — with love, Akshiv ❤️" />
  <meta property="og:image" content="https://web-app-chi-neon.vercel.app/akshiv/photo.jpg" />
  <meta property="og:type" content="website" />
  <style>
    :root {
      --cream: #f6efdc;
      --leaf: #4e9a3e;
      --leaf-dark: #2f6b25;
      --bark: #6b4423;
      --sky: #eaf6e6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(160deg, #fff8e7 0%, #eaf6e6 60%, #dff0d8 100%);
      color: var(--bark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: var(--cream);
      border-radius: 28px;
      box-shadow: 0 18px 50px rgba(47, 107, 37, 0.25);
      overflow: hidden;
      border: 3px solid rgba(78, 154, 62, 0.35);
    }
    .banner {
      text-align: center;
      padding: 28px 24px 10px;
      position: relative;
    }
    .banner .emoji { font-size: 34px; letter-spacing: 6px; }
    h1 {
      margin: 10px 0 2px;
      font-size: 30px;
      color: var(--bark);
      line-height: 1.15;
    }
    h1 .sub { display: block; font-size: 19px; font-weight: 600; margin-top: 4px; }
    .name {
      font-size: 34px;
      color: var(--leaf-dark);
      margin: 6px 0 0;
      font-weight: 800;
    }
    .photo-wrap { padding: 14px 18px 4px; }
    .photo-wrap img {
      width: 100%;
      display: block;
      border-radius: 18px;
      border: 4px solid #fff;
      box-shadow: 0 8px 22px rgba(0,0,0,0.15);
    }
    .footer {
      text-align: center;
      padding: 12px 20px 26px;
      font-size: 16px;
      color: var(--leaf-dark);
      font-weight: 600;
    }
    .save-hint {
      display: block;
      font-size: 13px;
      color: var(--bark);
      opacity: 0.7;
      font-weight: 500;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="banner">
      <div class="emoji">🐒 🐯 🌿</div>
      <h1>Thanks<span class="sub">for celebrating my birthday with me</span></h1>
      <div style="margin-top:12px; font-size:15px; color:var(--leaf-dark); font-weight:600;">With love</div>
      <div class="name">Akshiv ❤️</div>
    </div>
    <div class="photo-wrap">
      <a href="photo.jpg">
        <img src="photo.jpg" alt="Akshiv at his jungle-themed birthday party" />
      </a>
    </div>
    <div class="footer">
      🎈 Thank you for making my day special! 🎈
      <span class="save-hint">Tap the photo to view it full size or save it.</span>
    </div>
  </main>
</body>
</html>
