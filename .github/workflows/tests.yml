# Runs the suite on every push and pull request.
#
# Worth having on a public repo for a reason beyond the usual: this codebase ships with guards
# that keep private data out of it (tests/test_no_private_data.py). A guard nobody runs is a
# comment. This is what runs them.
#
# No secrets, no network, no database: the tests use SQLite in a temp file and stub every
# outbound call, so a fork gets a green tick without configuring anything.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]   # the range the code is known to run on
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
